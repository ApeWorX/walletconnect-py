[build-system]
requires = ["setuptools>=75.6.0", "setuptools_scm[toml]>=5.0"]
build-backend = "setuptools.build_meta"

[project]
name = "walletconnect"
description = "walletconnect: WalletConnect v2 (Reown) client implementation in Python"
readme = "README.md"
authors = [
    {name = "ApeWorX Ltd.", email = "admin@apeworx.io"}
]
license = "Apache-2.0"
keywords = ["ethereum", "walletconnect", "reown"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "cryptography>=42,<47",
    "websockets>=13,<16",
    "platformdirs>=4,<5",
]
dynamic = ["version"]

[project.optional-dependencies]
qr = [
    "segno>=1.6,<2",  # Terminal QR codes for pairing URIs
]

[project.urls]
Homepage = "https://github.com/ApeWorX/walletconnect-py"
Issues = "https://github.com/ApeWorX/walletconnect-py/issues"

[dependency-groups]
test = [
    "pytest>=6.0",
    "pytest-xdist",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "hypothesis>=6.2.0,<7",
    "segno>=1.6,<2",  # Exercise the optional `qr` extra
]
lint = [
    "mypy>=1.15.0,<2",
    "types-setuptools",
    "ruff>=0.9.0",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    "commitlint",
    "prek",
    "pytest-watch",
    "IPython",
    "ipdb",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
walletconnect = ["py.typed"]

[tool.setuptools_scm]
write_to = "walletconnect/version.py"

[tool.mypy]
exclude = "build/"
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger (catches breakpoint/pdb)
    "T20",    # flake8-print
    "PYI",    # flake8-pyi
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "ARG",    # flake8-unused-arguments
]
ignore = [
    "TC003",  # Move stdlib import into TYPE_CHECKING block
]

[tool.ruff.lint.per-file-ignores]
"version.py" = ["ALL"]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG001", "ARG002"]  # Pytest fixtures may appear unused
"examples/**/*.py" = ["T20"]  # CLI scripts print to stdout

[tool.ruff.lint.isort]
force-wrap-aliases = true
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = """
    --cov-branch
    --cov-report term
    --cov-report html
    --cov-report xml
    --cov=walletconnect
"""
python_files = "test_*.py"
testpaths = "tests"
markers = [
    "fuzzing: Run Hypothesis fuzz test suite",
    "live: Opt-in tests that talk to the real WalletConnect relay",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mdformat]
number = true
